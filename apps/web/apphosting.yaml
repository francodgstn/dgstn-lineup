# Firebase App Hosting — Next.js SSR on Cloud Run
# Node version is read from package.json engines.node.

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  # Firebase web config — these are public values (embedded in the JS bundle)
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: linyup-staging
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: linyup-staging.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: https://linyup-staging.firebaseio.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: linyup-staging.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "157648925506"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:157648925506:web:5e3aa70930d777f8374edb
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAuMHWbGKmyL78xVfrStkIctShzqrd4zcg
    availability:
      - BUILD
      - RUNTIME
  # PostHog product analytics — left empty so staging does NOT pollute the prod
  # PostHog project. Set this to a dedicated staging key (or a separate PostHog
  # environment) if you want staging analytics; empty = no-op.
  - variable: NEXT_PUBLIC_POSTHOG_KEY
    value: ""
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_POSTHOG_HOST
    value: https://eu.i.posthog.com
    availability:
      - BUILD
      - RUNTIME
