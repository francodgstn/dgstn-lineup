# Member app lanes — decoupled from the backend's v* release train.
#
#   PR touching the app or shared      → lint, jest, tsc, `expo config` per profile
#   main merge touching the app/shared → the `staging` channel: an OTA update when a
#                                        build with the current native fingerprint
#                                        already exists, a `preview` BUILD otherwise
#                                        (ANDROID ONLY for now — see the staging job)
#   mobile-v* tag                      → the `production` channel: same rule with the
#                                        `store` profile, and builds are auto-submitted
#
# Why a separate tag: docs/mobile-roadmap-2026-09.md §3. Why fingerprint:
# app.config.js sets runtimeVersion.policy = 'fingerprint', so an update can only
# land on builds whose native project hashes the same — "does a build with this
# fingerprint exist on this profile" IS the OTA-vs-build question, and Expo's
# continuous-deploy-fingerprint action is the maintained implementation of it
# (it computes both platforms' fingerprints, checks EAS for matching builds,
# triggers builds that are missing, publishes updates otherwise, and comments
# the result on the commit/PR).
#
# Secrets: EXPO_TOKEN (repository secret). FIREBASE_API_KEY per environment is
# an EAS ENVIRONMENT VARIABLE (development/preview/production), never an
# eas.json `env` literal — eas.json does not interpolate `${…}`.
#
# Action version: the `continuous-deploy-fingerprint` sub-action exists on
# expo-github-action v9 (and main) — NOT on the v8 tag, where the first run on
# main died with "Can't find action.yml". Its inputs (profile, branch,
# environment, platform, auto-submit-builds, github-token, working-directory)
# are verified against v9's action.yml. `environment` is passed explicitly so
# the EAS environment variables (FIREBASE_API_KEY) apply to `eas update` as
# well as to the build the profile names.
#
# Settled 2026-09-03, when docs/mobile-eas-setup.md was executed for staging:
# `auto-submit-builds` IS the input's real name (checked against v9's
# action.yml), and the `preview` environment carries FIREBASE_API_KEY. The
# `production` environment does NOT — that is the prod key, deliberately still
# absent, so the release lane cannot build until it is added.
name: Mobile

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/mobile.yml'
    tags: ['mobile-v*']
  workflow_dispatch: {}

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Lint · test · typecheck · config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: Lint
        run: pnpm --filter @linyup/mobile run lint

      # No `-- --ci`: pnpm hands the `--` to Jest as a test-path pattern (zero
      # matches, red job — the first run on main). Jest reads CI=true, which
      # GitHub sets, and behaves as --ci from that alone.
      - name: Unit tests
        run: pnpm --filter @linyup/mobile run test

      - name: Typecheck
        run: pnpm --filter @linyup/mobile run typecheck

      # Every build profile must evaluate app.config.js without throwing — the
      # class of failure that otherwise surfaces only on EAS's clock (the HMD-era
      # eas.json pointed at project ids the config rejects, for weeks).
      - name: Evaluate app config per profile
        working-directory: apps/mobile
        run: |
          for id in linyup-staging linyup-prod; do
            echo "== FIREBASE_PROJECT_ID=$id =="
            FIREBASE_PROJECT_ID=$id FIREBASE_API_KEY=ci-placeholder npx expo config --type public --json > /dev/null
          done

  # ── main → staging channel ────────────────────────────────────────────────
  staging:
    name: Staging channel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: OTA update, or preview build when the native fingerprint changed
        uses: expo/expo-github-action/continuous-deploy-fingerprint@v9
        with:
          working-directory: apps/mobile
          profile: preview
          branch: staging
          environment: preview
          # Android only, deliberately. With no build matching the current
          # fingerprint the action BUILDS rather than updates, and an iOS
          # internal-distribution build needs an ad hoc provisioning profile
          # listing device UDIDs — i.e. an Apple Developer login and
          # `eas device:create`, neither of which exists yet. `all` here would
          # make every run on main red on its iOS half. Widen to `all` once
          # the Apple account is set up (docs/mobile-roadmap-2026-09.md §7).
          platform: android
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── mobile-v* → production channel / store ────────────────────────────────
  release:
    name: Production channel / store
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: OTA update, or store build + submit when the native fingerprint changed
        uses: expo/expo-github-action/continuous-deploy-fingerprint@v9
        with:
          working-directory: apps/mobile
          profile: store
          branch: production
          environment: production
          platform: all
          auto-submit-builds: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
