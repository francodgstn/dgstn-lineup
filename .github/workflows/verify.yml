name: Verify

# `workflow_call` lets the deploy workflows run these exact checks as a gate
# before shipping. Until that was wired, verify ran on pull requests ONLY — so a
# tagged release, or anything that reached `main` without a PR, deployed to a real
# project having never been typechecked, linted or tested.
#
# Keep this workflow free of secrets. It builds with placeholder env values on
# purpose, which is what makes it safe to call from anywhere.
on:
  pull_request:
    branches: [main]
  workflow_call: {}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # apps/web has no test runner, so this is the only place locale parity is
      # enforced. It also fails if a lane's message fragment was never merged.
      - name: Locales
        run: pnpm i18n:check

  test-functions:
    name: Functions Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: Build functions
        run: pnpm --filter @linyup/functions run build

      # mocha exits 1 on "No test files found"; run it only once tests exist so
      # the job stays green until function tests are added (and fails on real
      # test failures thereafter).
      - name: Run function tests
        run: |
          if find packages/functions/src -name '*.test.ts' | grep -q .; then
            pnpm --filter @linyup/functions run test
          else
            echo "No function tests yet — skipping."
          fi
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

  build-admin:
    name: Build Admin Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @linyup/shared run build

      - name: Build admin console
        run: pnpm --filter @linyup/admin run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: placeholder

  build-landing:
    name: Build Landing Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing site
        run: pnpm --filter @linyup/landing run build
        # Keep these matching deploy.yml / deploy-prod.yml so the verify build
        # exercises the same config the real build uses. They were left on a
        # pre-rename `lineup.io` domain that has never existed for this product.
        env:
          PUBLIC_APP_URL: https://app.linyup.com
          PUBLIC_SITE_URL: https://linyup.com
