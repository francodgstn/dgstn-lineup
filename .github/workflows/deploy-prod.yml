name: Deploy Production

# Production deploys are manual-gated: trigger by hand (workflow_dispatch) or by
# pushing a release tag. The `production` GitHub environment should require a
# manual reviewer approval before this job runs.
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_DEPLOY_SA }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @linyup/shared run build

      - name: Build functions
        run: pnpm --filter @linyup/functions run build

      # Cloud Build (run by `firebase deploy`) only sees packages/functions and
      # uses plain `npm install`, which cannot resolve pnpm's `workspace:*`
      # protocol for @linyup/shared. Vendor the built shared package into
      # packages/functions and rewrite the dep to file:./vendor/shared so npm
      # can install it. Mutates the ephemeral CI checkout only.
      - name: Vendor @linyup/shared for Cloud Build
        run: node scripts/vendor-shared-for-deploy.mjs

      - name: Build landing site
        run: pnpm --filter @linyup/landing run build
        env:
          PUBLIC_APP_URL: https://app.linyup.com
          PUBLIC_SITE_URL: https://linyup.com

      # The Next.js web app is NOT deployed here — Firebase App Hosting builds
      # and deploys it automatically when it detects a push to the connected
      # GitHub branch. This workflow only covers what App Hosting doesn't handle.
      - name: Deploy to Firebase (Production)
        run: npx firebase-tools deploy --project production --only functions,hosting:landing,firestore --non-interactive --force
