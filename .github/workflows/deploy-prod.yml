name: Deploy Production

# Production deploys are manual-gated: trigger by hand (workflow_dispatch) or by
# pushing a release tag. The `production` GitHub environment should require a
# manual reviewer approval before this job runs.
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_DEPLOY_SA }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build functions
        run: pnpm --filter @linyup/functions run build

      - name: Build web app
        run: pnpm --filter @linyup/web run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.PROD_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: linyup-prod.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://linyup-prod.firebaseio.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: linyup-prod
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: linyup-prod.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PROD_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.PROD_APP_ID }}

      - name: Build landing site
        run: pnpm --filter @linyup/landing run build
        env:
          PUBLIC_APP_URL: https://app.lineup.io
          PUBLIC_SITE_URL: https://lineup.io

      - name: Deploy to Firebase (Production)
        run: npx firebase-tools deploy --project production --only functions,hosting:app,hosting:landing,firestore --non-interactive
