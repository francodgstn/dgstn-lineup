name: Deploy Production

# Production deploys are manual-gated: trigger by hand (workflow_dispatch) or by
# pushing a release tag. The `production` GitHub environment should require a
# manual reviewer approval before this job runs.
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          # Use the shared CI SA (linyup-ci-deploy@linyup-admin): it's the only
          # service account with a working Workload Identity binding (provisioned
          # in infra/bootstrap) and it already holds prod-project roles. The
          # separate GCP_PROD_DEPLOY_SA has no WIF binding, so impersonation fails
          # and firebase-tools reports "Failed to authenticate". Reinstate a
          # dedicated prod SA with a refs/heads/main ref condition via Terraform
          # later, then switch this back to GCP_PROD_DEPLOY_SA.
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @linyup/shared run build

      - name: Build functions
        run: pnpm --filter @linyup/functions run build

      # Cloud Build (run by `firebase deploy`) only sees packages/functions and
      # uses plain `npm install`, which cannot resolve pnpm's `workspace:*`
      # protocol for @linyup/shared. Vendor the built shared package into
      # packages/functions and rewrite the dep to file:./vendor/shared so npm
      # can install it. Mutates the ephemeral CI checkout only.
      - name: Vendor @linyup/shared for Cloud Build
        run: node scripts/vendor-shared-for-deploy.mjs

      - name: Build landing site
        run: pnpm --filter @linyup/landing run build
        env:
          PUBLIC_APP_URL: https://app.linyup.com
          PUBLIC_SITE_URL: https://linyup.com
          PUBLIC_FIREBASE_PROJECT_ID: linyup-prod
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PROD_FIREBASE_API_KEY }}
          # PostHog product analytics — set the PROD_POSTHOG_KEY repo variable to the
          # public project key (phc_…). Unset → analytics stays off (no script loads).
          PUBLIC_POSTHOG_KEY: ${{ vars.PROD_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com

      # TEMPORARY DIAGNOSTIC — capture the real auth failure.
      # firebase-tools masks the WIF→STS→impersonation error as the generic
      # "Failed to authenticate". This step forces the same exchange via gcloud
      # (raw STS/IAM error) and via firebase-tools --debug, then prints the
      # credentials-file type. It never fails the job (continue-on-error), so it
      # only adds signal. Remove once the WIF/SA issue is resolved.
      - name: Diagnose auth (debug)
        continue-on-error: true
        run: |
          echo "::group::credentials file (external_account vs service_account)"
          python3 -c "import json,os;f=os.environ['GOOGLE_APPLICATION_CREDENTIALS'];d=json.load(open(f));print('type:',d.get('type'));print('audience:',d.get('audience'));print('sa_impersonation_url:',d.get('service_account_impersonation_url'))" || true
          echo "::endgroup::"
          echo "::group::gcloud token exchange (raw STS/IAM error)"
          gcloud auth print-access-token --verbosity=debug 2>&1 | tail -60 || true
          echo "::endgroup::"
          echo "::group::firebase-tools projects:list --debug (tail)"
          npx firebase-tools projects:list --debug 2>&1 | tail -80 || true
          echo "::endgroup::"

      # Backend first: functions, Firestore rules/indexes, and the static landing
      # site. The App Hosting apps (web + admin) are rolled out AFTER this so the
      # frontend never goes live ahead of the backend it depends on.
      # Retry wrapper: the WIF→STS token exchange occasionally fails ("Failed to
      # authenticate") and the per-minute Cloud Functions mutation quota 429s on a
      # full redeploy. Both are transient and converge on re-run (auth blips clear;
      # already-updated functions are skipped next pass). 30s gaps let the quota reset.
      - name: Deploy to Firebase (Production)
        run: |
          for attempt in 1 2 3 4 5; do
            if npx firebase-tools deploy --project production --only functions,hosting:landing,firestore --non-interactive --force; then
              exit 0
            fi
            echo "::warning::firebase deploy attempt $attempt failed; retrying in 30s…"
            sleep 30
          done
          echo "::error::firebase deploy failed after 5 attempts"
          exit 1

      # App Hosting (Next.js SSR) — web + admin. Auto-rollout is DISABLED on the
      # PROD backends (see infra/README.md §6), so prod ships ONLY through this
      # gated workflow, in lockstep with the backend deploy above. We roll out the
      # exact commit being deployed ($GITHUB_SHA) rather than a branch tip, so a
      # concurrent merge can't sneak into the production rollout.
      - name: Roll out web app (App Hosting, prod)
        run: |
          for attempt in 1 2 3 4 5; do
            if npx firebase-tools apphosting:rollouts:create linyup-web --project production --git-commit "$GITHUB_SHA" --non-interactive; then
              exit 0
            fi
            echo "::warning::web rollout attempt $attempt failed; retrying in 30s…"
            sleep 30
          done
          echo "::error::web rollout failed after 5 attempts"
          exit 1

      - name: Roll out operator console (App Hosting, prod)
        run: |
          for attempt in 1 2 3 4 5; do
            if npx firebase-tools apphosting:rollouts:create linyup-admin --project production --git-commit "$GITHUB_SHA" --non-interactive; then
              exit 0
            fi
            echo "::warning::operator console rollout attempt $attempt failed; retrying in 30s…"
            sleep 30
          done
          echo "::error::operator console rollout failed after 5 attempts"
          exit 1
