name: Deploy Staging

on:
  push:
    branches: [main]

# Required for keyless auth to GCP via Workload Identity Federation (OIDC).
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # Keyless auth — exchanges the GitHub OIDC token for short-lived GCP
      # credentials and writes an ADC file. firebase-tools and gcloud both read
      # it automatically; no JSON service-account key is involved.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @linyup/shared run build

      - name: Build functions
        run: pnpm --filter @linyup/functions run build

      # Cloud Build (run by `firebase deploy`) only sees packages/functions and
      # uses plain `npm install`, which cannot resolve pnpm's `workspace:*`
      # protocol for @linyup/shared. Vendor the built shared package into
      # packages/functions and rewrite the dep to file:./vendor/shared so npm
      # can install it. Mutates the ephemeral CI checkout only.
      - name: Vendor @linyup/shared for Cloud Build
        run: node scripts/vendor-shared-for-deploy.mjs

      - name: Build web app
        run: pnpm --filter @linyup/web run build
        env:
          # Public Firebase config — sourced from `terraform output firebase_web_config`
          # and stored as GitHub Actions variables (not secrets; these ship in the
          # browser bundle). Static values derive deterministically from the project ID.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.STAGING_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: linyup-staging.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://linyup-staging.firebaseio.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: linyup-staging
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: linyup-staging.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.STAGING_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.STAGING_APP_ID }}

      - name: Build landing site
        run: pnpm --filter @linyup/landing run build
        env:
          PUBLIC_APP_URL: https://app.linyup.com
          PUBLIC_SITE_URL: https://linyup.com

      # ADC from the auth step is detected automatically — do NOT pass any
      # GOOGLE_APPLICATION_CREDENTIALS* env var here.
      # --force: required in CI so firebase-tools sets up the Artifact Registry
      # cleanup policy non-interactively (otherwise it prompts and exits 1 after a
      # successful deploy) and skips the confirmation prompt when functions are
      # removed from source.
      - name: Deploy to Firebase (Staging)
        run: npx firebase-tools deploy --project staging --only functions,hosting:landing,firestore --non-interactive --force




