name: Deploy Sandbox

# Backend for the demo playground: Cloud Functions + Firestore rules/indexes +
# Storage rules.
#
# MANUAL DISPATCH ONLY — deliberately. The sandbox hosts live lead demos, so
# nothing lands in it unattended: a rules change that denies a read, or a
# function that throws, would otherwise break a demo mid-pitch. Deploy by hand
# from the Actions tab when you're ready. The trade-off is that sandbox can drift
# behind main, so deploy before a demo if backend code changed.
#
# NOTE: the sandbox WEB APP (apps/web) is a separate story — it rolls out via
# Firebase App Hosting's own GitHub integration, which is configured on the
# backend in the Firebase Console, NOT here. Removing this workflow's push
# trigger does NOT stop that. Turn off automatic rollouts in
# Console → App Hosting → backend → Deployment settings.
#
# Demo *data* is only ever touched by an explicit reseed run below.

on:
  workflow_dispatch:
    inputs:
      reseed_demo:
        description: 'DESTRUCTIVE: wipe & reseed the /try demo data after deploy (lead tenants are preserved)'
        type: boolean
        default: false

# Required for keyless auth to GCP via Workload Identity Federation (OIDC).
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Sandbox (functions, firestore, storage)
    runs-on: ubuntu-latest
    environment: sandbox

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to 22.22.3: Node 22.23.0 carries a keep-alive regression
          # (nodejs/node#63989) that makes firebase-tools' STS token exchange
          # fail with "Premature close" under Workload Identity Federation, so
          # `firebase deploy` reports "Failed to authenticate". Unpin once Node
          # ships a fix. gcloud (Python) is unaffected.
          node-version: '22.22.3'
          cache: 'pnpm'

      # Keyless auth — exchanges the GitHub OIDC token for short-lived GCP
      # credentials and writes an ADC file. firebase-tools reads it automatically;
      # no JSON service-account key is involved. The deploy SA already has roles on
      # linyup-sandbox (granted by infra/environments/sandbox iam module).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @linyup/shared run build

      - name: Build functions
        run: pnpm --filter @linyup/functions run build

      # Cloud Build (run by `firebase deploy`) only sees packages/functions and
      # uses plain `npm install`, which cannot resolve pnpm's `workspace:*`
      # protocol for @linyup/shared. Vendor the built shared package into
      # packages/functions and rewrite the dep to file:./vendor/shared so npm can
      # install it. Mutates the ephemeral CI checkout only.
      - name: Vendor @linyup/shared for Cloud Build
        run: node scripts/vendor-shared-for-deploy.mjs

      # ADC from the auth step is detected automatically — do NOT pass any
      # GOOGLE_APPLICATION_CREDENTIALS* env var here.
      # --force: lets firebase-tools set up the Artifact Registry cleanup policy
      # non-interactively and skips the confirmation prompt when functions are
      # removed from source. No hosting:landing (sandbox has no landing site) and
      # no database — RTDB is unused and the sandbox project has no RTDB instance
      # (deploying its rules would fail with "haven't created a Realtime Database
      # instance").
      - name: Deploy to Firebase (Sandbox)
        run: npx firebase-tools deploy --project sandbox --only functions,firestore,storage --non-interactive --force

      # Optional demo reseed — reseed_demo=true only, so a routine backend deploy
      # never wipes the running demo. Reuses the ADC from the auth step; the
      # deploy SA's roles/firebase.admin covers Firestore + Auth writes.
      # GOOGLE_CLOUD_PROJECT is pinned to satisfy reset-sandbox-db.ts's project
      # guard regardless of what the auth step exported. Runs after deploy so the
      # fresh data lands against the just-deployed rules/indexes (e.g. fromBioLink).
      #
      # `--yes` is the non-interactive escape hatch for the typed confirmation
      # (there is no TTY here). LEAD TENANTS ARE PRESERVED by default — this only
      # resets the /try playground. Wiping a lead demo is deliberately not
      # reachable from CI; do it locally with `pnpm lead:seed --lead <id> --reset`.
      - name: Reseed /try demo data (destructive)
        if: ${{ inputs.reseed_demo }}
        env:
          GOOGLE_CLOUD_PROJECT: linyup-sandbox
        run: |
          pnpm sandbox:reset --yes
          pnpm sandbox:seed
